openapi: 3.0.0
info:
  title: PromoLink API # API PromoLink
  description: API for the PromoLink web application. # API для веб-приложения PromoLink.
  version: 1.0.0

paths:
  /token:
    post:
      summary: Login for access token # Вход для получения токена доступа
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string # Имя пользователя
                password:
                  type: string # Пароль
      responses:
        '200':
          description: Successful login # Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string # Токен доступа
                  token_type:
                    type: string # Тип токена

  /users/me:
    get:
      summary: Get current user # Получить текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response # Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /promo-cards/{qr_serial}:
    get:
      summary: Get promo card by QR serial # Получить промо-карту по QR-серийному номеру
      parameters:
        - name: qr_serial # QR-серийный номер
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response # Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCard'

  /promo-cards:
    post:
      summary: Create a new promo card # Создать новую промо-карту
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCardCreate'
      responses:
        '201':
          description: Promo card created # Промо-карта создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCard'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer # Идентификатор пользователя
        username:
          type: string # Имя пользователя
        role:
          type: string # Роль пользователя

    PromoCard:
      type: object
      properties:
        id:
          type: integer # Идентификатор промо-карты
        qr_serial:
          type: string # QR-серийный номер
        status:
          type: string # Статус карты
        client_id:
          type: integer # Идентификатор клиента
        product_id:
          type: integer # Идентификатор продукта
        discount_id:
          type: integer # Идентификатор скидки
        issued_by_user_id:
          type: integer # Идентификатор пользователя, выдавшего карту
        valid_from:
          type: string
          format: date # Действительна с
        valid_until:
          type: string
          format: date # Действительна до

    PromoCardCreate:
      type: object
      properties:
        qr_serial:
          type: string # QR-серийный номер
        unp:
          type: string # УНП клиента
        product_id:
          type: integer # Идентификатор продукта
        valid_from:
          type: string
          format: date # Действительна с
        valid_until:
          type: string
          format: date # Действительна до
