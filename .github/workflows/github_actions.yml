name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt # Assuming requirements.txt will be created
      - name: Run backend tests
        run: pytest backend/tests/ # Assuming tests will be in backend/tests/

  frontend_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Use appropriate Flutter version
          channel: 'stable'
      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: frontend
      - name: Run frontend tests
        run: flutter test
        working-directory: frontend

  # TODO: Add build and deployment steps
